global:
  scrape_interval: 5s

scrape_configs:
  - job_name: checkout
    metrics_path: /metrics
    static_configs:
      - targets: ["checkout:8001"]

  - job_name: inventory
    metrics_path: /metrics
    static_configs:
      - targets: ["inventory:8002"]

  - job_name: payment
    metrics_path: /metrics
    static_configs:
      - targets: ["payment:8003"]
